<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALERÍA DE RECUERDOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b003a 0%, #080014 100%);
            font-family: 'Montserrat', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        #overlay-inicio {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 0, 20, 0.95);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #overlay-inicio h2 {
            font-size: 2rem;
            color: #fff;
            text-shadow: 0 0 20px #ff007f;
            margin-bottom: 15px;
            text-align: center;
            padding: 0 20px;
        }

        #overlay-inicio p {
            font-size: 1.1rem;
            color: #00ffff;
            animation: latir 1.5s infinite;
        }

        @keyframes latir {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        #contenedor-corazones {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }

        .top-controls {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
        }

        .btn-control:hover { transform: scale(1.05); background: rgba(255, 0, 127, 0.4); }

        .corazon-flotante {
            position: absolute; bottom: -40px;
            animation: flotarHaciaArriba linear forwards;
        }

        @keyframes flotarHaciaArriba {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* TÍTULO 3D LETRA POR LETRA */
        .titulo-3d-container {
            margin-top: 60px;
            z-index: 2;
            text-align: center;
            padding: 0 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            min-height: 55px;
        }

        .letra-3d {
            display: inline-block;
            font-size: 2.1rem;
            font-weight: 900;
            color: #ffffff;
            /* Efecto de volumen 3D con sombras multicapa y neón */
            text-shadow: 
                1px 1px 0 #ff007f, 
                2px 2px 0 #e60073, 
                3px 3px 0 #cc0066, 
                4px 4px 0 #99004d, 
                5px 5px 12px rgba(0, 0, 0, 0.9),
                0 0 15px rgba(0, 255, 255, 0.8);
            opacity: 0;
            transform: translateY(-25px) scale(0.5) rotateX(45deg);
            transition: opacity 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: flotarLatir 3.5s ease-in-out infinite alternate;
        }

        .letra-3d.visible {
            opacity: 1;
            transform: translateY(0) scale(1) rotateX(0deg);
        }

        .letra-3d.desaparecer {
            opacity: 0;
            transform: translateY(25px) scale(0.7);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        @keyframes flotarLatir {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.05); }
        }

        .galeria-caja {
            width: 100%;
            overflow: hidden;
            position: relative;
            padding: 50px 0 40px 0;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            z-index: 2;
        }

        .cuerda {
            position: absolute; top: 65px; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #8a5a36, #d2b48c, #8a5a36);
        }

        .riel-desplazamiento {
            display: flex; width: max-content;
            animation: desplazar 120s linear infinite;
        }

        @keyframes desplazar { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .item-cuerda { display: flex; flex-direction: column; align-items: center; margin: 0 28px; position: relative; }

        .polaroid {
            background: #ffffff; padding: 12px 12px 18px 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border-radius: 6px; width: 220px;
            transform-origin: top center;
            animation: balanceoFoto 3.5s ease-in-out infinite alternate;
        }

        @keyframes balanceoFoto { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }

        .contenedor-foto {
            position: relative;
            width: 196px;
            height: 225px;
            background: #231238;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-corazon {
            font-size: 1.8rem;
            animation: latir 1s infinite alternate;
            opacity: 0.7;
        }

        .polaroid img { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border-radius: 3px; 
            display: block; 
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .polaroid img.cargada {
            opacity: 1;
        }

        .texto-polaroid {
            font-family: 'Caveat', cursive; font-size: 1.3rem; color: #1a1a1a;
            text-align: center; margin: 10px 0 0 0; font-weight: 600;
        }

        .frase-bottom {
            text-align: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: 800;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.9); z-index: 2;
            padding: 0 10px;
        }

        @media (min-width: 768px) {
            .titulo-3d-container { margin-top: 65px; gap: 6px; }
            .letra-3d { font-size: 3.5rem; }
            .btn-control { font-size: 0.85rem; padding: 10px 20px; }
            .top-controls { top: 20px; right: 25px; gap: 12px; }
            .polaroid { width: 240px; }
            .contenedor-foto { width: 216px; height: 245px; }
            .frase-bottom { font-size: 1.5rem; margin-bottom: 25px; }
        }
    </style>
</head>
<body>

<div id="overlay-inicio" onclick="iniciarExperiencia()">
    <h2>Nuestra Galería de Recuerdos 💖</h2>
    <p>✨ Toca la pantalla para entrar ✨</p>
</div>

<div id="contenedor-corazones"></div>
<audio id="musicaFondo" loop></audio>

<div class="top-controls">
    <button id="btnFullscreen" class="btn-control" onclick="toggleFullscreen()">⛶ Pantalla Completa</button>
    <button id="btnMusica" class="btn-control" onclick="toggleMusica()">🎵 Música: OFF</button>
</div>

<!-- Título 3D dinámico -->
<div class="titulo-3d-container" id="titulo3D"></div>

<div class="galeria-caja">
    <div class="cuerda"></div>
    <div class="riel-desplazamiento" id="riel-fotos">
        <!-- Fotos dinámicas -->
    </div>
</div>

<div class="frase-bottom">Nuestra historia en imágenes 💖 ✨ 🌙</div>

<script>
const LISTA_DE_FRASES = [
    "Tú y yo, mi momento preferido del día. 💖✨",
    "Contigo cada instante se vuelve inolvidable. 🌙✨",
    "Mi lugar favorito en el mundo siempre es a tu lado. 🌹",
    "Cada foto guarda una sonrisa que me sacaste. 📸❤",
    "El mejor capítulo de mi vida lo escribo contigo. 📖💖",
    "Gracias por iluminar mis días con tu existencia. ✨💫",
    "Un recuerdo más de todos los que nos faltan por vivir. 🥰",
    "Amor del bueno, del que hace bien al alma. 💘"
];

const REPO_USUARIO = "marce20vazquez-code/galeria-beid";
const audio = document.getElementById('musicaFondo');
const btnMusica = document.getElementById('btnMusica');

// ANIMACIÓN DE TÍTULO 3D LETRA POR LETRA Y CICLO DE 30 SEGUNDOS
function iniciarAnimacionTitulo() {
    const container = document.getElementById('titulo3D');
    const texto = "RECUERDOS";
    container.innerHTML = "";
    
    const spans = [];
    for (let i = 0; i < texto.length; i++) {
        const span = document.createElement('span');
        span.className = 'letra-3d';
        span.textContent = texto[i];
        container.appendChild(span);
        spans.push(span);
    }

    function ejecutarCiclo() {
        // Resetear clases
        spans.forEach(span => {
            span.classList.remove('visible', 'desaparecer');
        });

        // 1. Aparecer letra por letra (180ms de desfase por letra)
        spans.forEach((span, index) => {
            setTimeout(() => {
                span.classList.add('visible');
            }, index * 180);
        });

        // 2. A los 25 segundos, desaparece suavemente
        setTimeout(() => {
            spans.forEach(span => {
                span.classList.remove('visible');
                span.classList.add('desaparecer');
            });
        }, 25000);
    }

    ejecutarCiclo();
    // Repetir ciclo cada 30 segundos
    setInterval(ejecutarCiclo, 30000);
}

async function cargarArchivosAutomaticos() {
    try {
        const resFotos = await fetch(`https://api.github.com/repos/${REPO_USUARIO}/contents/fotos`);
        const dataFotos = await resFotos.json();
        
        let fotos = [];
        if (Array.isArray(dataFotos)) {
            fotos = dataFotos
                .filter(f => f.name.match(/\.(jpg|jpeg|png|webp|gif)$/i))
                .map(f => ({
                    nombre: f.name,
                    cdn: `https://cdn.jsdelivr.net/gh/${REPO_USUARIO}@main/fotos/${encodeURIComponent(f.name)}`,
                    github: f.download_url
                }));
        }

        const resMusica = await fetch(`https://api.github.com/repos/${REPO_USUARIO}/contents/musica`);
        const dataMusica = await resMusica.json();
        
        let canciones = [];
        if (Array.isArray(dataMusica)) {
            canciones = dataMusica
                .filter(f => f.name.match(/\.(mp3|wav|ogg|m4a)$/i))
                .map(f => `https://cdn.jsdelivr.net/gh/${REPO_USUARIO}@main/musica/${encodeURIComponent(f.name)}`);
        }

        inicializarGaleria(fotos, canciones);
    } catch (e) {
        console.error("Error cargando archivos de GitHub", e);
    }
}

function inicializarGaleria(fotos, canciones) {
    const riel = document.getElementById('riel-fotos');
    
    if (canciones.length > 0) {
        const indiceAleatorio = Math.floor(Math.random() * canciones.length);
        audio.src = canciones[indiceAleatorio];
    }

    if (fotos.length > 0) {
        const fotosTotales = [...fotos, ...fotos];
        let htmlFotos = "";
        fotosTotales.forEach((foto, idx) => {
            const frase = LISTA_DE_FRASES[idx % LISTA_DE_FRASES.length];
            htmlFotos += `
            <div class="item-cuerda">
                <div class="polaroid">
                    <div class="contenedor-foto">
                        <div class="loader-corazon">💖</div>
                        <img src="${foto.cdn}" 
                             alt="Recuerdo" 
                             loading="lazy"
                             referrerpolicy="no-referrer"
                             onload="this.classList.add('cargada'); if(this.previousElementSibling) this.previousElementSibling.remove();"
                             onerror="if(!this.dataset.fallback){this.dataset.fallback='1'; this.src='${foto.github}';}" />
                    </div>
                    <p class="texto-polaroid">${frase}</p>
                </div>
            </div>`;
        });
        riel.innerHTML = htmlFotos;
    }
}

function activarPantallaCompleta() {
    const el = document.documentElement;
    if (el.requestFullscreen) {
        el.requestFullscreen().catch(err => console.log(err));
    } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
    }
}

function iniciarExperiencia() {
    const overlay = document.getElementById('overlay-inicio');
    overlay.style.opacity = '0';
    setTimeout(() => { overlay.style.visibility = 'hidden'; }, 800);

    activarPantallaCompleta();

    if (audio.src) {
        audio.play().then(() => {
            btnMusica.innerHTML = '🎶 Música: ON';
        }).catch(err => console.log("Autoplay prevenido por navegador", err));
    }
}

function toggleMusica() {
    if (audio.paused) {
        audio.play();
        btnMusica.innerHTML = '🎶 Música: ON';
    } else {
        audio.pause();
        btnMusica.innerHTML = '🎵 Música: OFF';
    }
}

function toggleFullscreen() {
    const esFull = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if (!esFull) {
        activarPantallaCompleta();
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
    }
}

const iconosCorazones = ['❤️', '💖', '💕', '💗', '💓', '✨', '🌹'];
function crearCorazon() {
    const corazon = document.createElement('div');
    corazon.classList.add('corazon-flotante');
    corazon.innerHTML = iconosCorazones[Math.floor(Math.random() * iconosCorazones.length)];
    corazon.style.left = Math.random() * 100 + 'vw';
    corazon.style.fontSize = (Math.random() * 20 + 14) + 'px';
    corazon.style.animationDuration = (Math.random() * 5 + 6) + 's';
    document.getElementById('contenedor-corazones').appendChild(corazon);
    setTimeout(() => corazon.remove(), 11000);
}
setInterval(crearCorazon, 450);

iniciarAnimacionTitulo();
cargarArchivosAutomaticos();
</script>
</body>
</html>
